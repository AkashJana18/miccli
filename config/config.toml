[hotkey]
key = ""                     # main key; leave empty ("" or "None") for modifier-only hold
modifier = "Shift+Control"    # Command | Option | Control | Shift, combined with "+"

[whisper]
model = "small"
language = "en"
metal = true

[vad]
threshold = 0.5
min_speech_ms = 250
min_silence_ms = 500

[llm]
provider = "ollama"
model = "qwen2.5:1.5b"
enabled = false               # opt-in: prompt on first run (1=disabled, 2=ollama, 3=groq BYOK, 4=openai BYOK)

[insertion]
default = "auto"
key_delay_ms = 20
paste_delay_ms = 10
restore_clipboard = true

[tui]
mode = "overlay"              # overlay | dashboard | none  — overlay = minimal whisperflow, dashboard = full 4-tab, none = plain logs
