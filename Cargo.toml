[package]
name = "miccli"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["miccli contributors"]
description = "Terminal voice dictation CLI — local Whisper STT + code-aware cleanup + smart text insertion"
license = "MIT"
repository = "https://github.com/miccli/miccli"
homepage = "https://github.com/miccli/miccli"
documentation = "https://docs.rs/miccli"
readme = "README.md"
keywords = ["voice", "dictation", "whisper", "terminal", "stt"]
categories = ["command-line-utilities", "accessibility"]

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
cpal = "0.16"
whisper-rs = "0.16"
ort = { version = "2.0.0-rc.13", features = ["load-dynamic", "ndarray"] }
ndarray = "0.17"
rubato = "0.14"
global-hotkey = "0.8"
arboard = "3.6"
reqwest = { version = "0.13", features = ["json", "stream", "blocking"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
